id = "modularrouters"
name = "Modular Routers"
version = "0.2.17"
description = """A port of Modular Routers for Horizon: a router block entity with nine module slots, five upgrade
slots and a one-slot buffer that runs its installed modules every 20 ticks — a Puller Mk1 takes an item
from the container beside it into the buffer, a Puller Mk2 takes from the container you select up to
twelve blocks away, a Sender Mk1 pushes from the buffer into the first container along its facing, a
Sender Mk2 inserts into the container you select up to twenty-four blocks away, a
Void Module destroys what its filter accepts in the buffer, a Dropper Module throws what its filter
accepts into the block in its direction, a Flinger Module throws it the same way with the speed, pitch
and yaw you set on it, a Placer Module puts one item from the buffer back into the world as a block in
the block its direction names, a Breaker Module breaks the block its direction names with its saved
pickaxe (matching drops or the block itself) and puts the drops into the buffer, an Extruder Module Mk1 joins placer and breaker into one redstone-driven arm that places buffered blocks along its direction while powered and breaks them back with its saved pickaxe while unpowered, a Vacuum Module fills the buffer from the dropped items in
a box six blocks in every direction around it (the buffer's own item deciding what it collects, or
in front of it only when it is given a direction), a Speed Upgrade shortens the interval by
two ticks, a Stack Upgrade doubles the items per operation, the Range Augments move a module's reach
one block each in its four augment slots, a Stack Augment sets how many items one operation of that
module moves, and a Regulator Augment turns the module's saved amount on: a pull leaves that many of
the item in its source, a send tops its target up to it, and a vacuum stops filling its buffer at it.
The router block, its modules, its upgrades, its augments and their models, textures, lang, recipes,
loot and tags travel in this one package beside the code, so a single .hmod installs both halves."""
authors = ["Des Herriott", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side, not the hook's: a router is placed and ticked by an integrated
# server, which belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod does add a block, its items and a block entity type, and the manifest's shape is
# not negotiable.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
